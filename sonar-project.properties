# SonarQube Analiz Konfigürasyonu
# Bu dosya projenin kök dizininde bulunmalıdır.

# Proje tanımlayıcı (SonarQube'daki proje anahtarı)
# NOT: Mevcut "sqp_..." token'ı yalnızca "asd" projesine yetkili (proje token'ı).
# Düzgün bir ad istersen: SonarQube arayüzünde "belediye-sikayet" projesi + GLOBAL
# token oluştur, bu anahtarı değiştir, eski "asd" projesini sil.
sonar.projectKey=asd
sonar.projectName=Belediye Şikayet Sistemi
sonar.projectVersion=1.0.0

# Kaynak kod dizini
sonar.sources=lib,app,proxy.js

# Hariç tutulacak dizinler
sonar.exclusions=**/node_modules/**,**/.next/**,**/drizzle/**,**/*.config.js,**/scripts/**,**/public/**

# Test dosyaları (şu an yok ama ileride eklenecek)
# sonar.tests=__tests__

# Kaynak dosya kodlaması
sonar.sourceEncoding=UTF-8

# JavaScript/JSX analizi
sonar.language=js

# SonarQube sunucu adresi
sonar.host.url=http://localhost:9000

# Token (ilk kurulumda admin/admin ile giriş yapıp token üretilecek)
# sonar.token=squ_xxxxxxxxxxxxx
